<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1864ab"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 10; ry: 10; }
      .title { font-size: 15px; font-weight: 600; fill: #1b1f23; }
      .sub { font-size: 11.5px; fill: #495057; }
      .lane { font-size: 12px; font-weight: 700; letter-spacing: .5px; fill: #868e96; }
      .edge-label-sm { font-size: 10.5px; fill: #495057; }
      .step { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="840" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19px" font-weight="700" fill="#1b1f23">MCP Router — Authentication &amp; Principal Propagation Flow</text>
  <text x="500" y="50" text-anchor="middle" class="sub">Copilot Studio / MCP client → SAP IAS → Microsoft Entra ID → MCP Router (CAP) → Cloud Connector → ABAP</text>

  <!-- Lane backgrounds -->
  <rect x="20" y="75" width="220" height="560" rx="12" fill="#f8f9fa" stroke="#e9ecef"/>
  <rect x="250" y="75" width="290" height="560" rx="12" fill="#eef4ff" stroke="#d0e0ff"/>
  <rect x="550" y="75" width="200" height="560" rx="12" fill="#f1f8f4" stroke="#d3ecdc"/>
  <rect x="760" y="75" width="220" height="560" rx="12" fill="#fdf5ec" stroke="#f3e0c4"/>

  <text x="130" y="97" text-anchor="middle" class="lane">CLIENT</text>
  <text x="395" y="97" text-anchor="middle" class="lane">SAP IAS</text>
  <text x="650" y="97" text-anchor="middle" class="lane">MCP ROUTER (CAP)</text>
  <text x="870" y="97" text-anchor="middle" class="lane">ON-PREMISE (ABAP)</text>

  <!-- Client box -->
  <rect x="45" y="120" width="170" height="72" class="box" fill="#ffffff" stroke="#adb5bd"/>
  <text x="130" y="146" text-anchor="middle" class="title">MCP Client</text>
  <text x="130" y="165" text-anchor="middle" class="sub">Copilot Studio,</text>
  <text x="130" y="180" text-anchor="middle" class="sub">Power Automate, Bruno</text>

  <!-- IAS boxes -->
  <rect x="275" y="120" width="240" height="72" class="box" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="395" y="146" text-anchor="middle" class="title">SAP IAS</text>
  <text x="395" y="165" text-anchor="middle" class="sub">Authorization Code + PKCE</text>
  <text x="395" y="180" text-anchor="middle" class="sub">/oauth2/authorize · /oauth2/token</text>

  <rect x="275" y="245" width="240" height="72" class="box" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="395" y="271" text-anchor="middle" class="title">Microsoft Entra ID</text>
  <text x="395" y="290" text-anchor="middle" class="sub">Corporate identity provider</text>
  <text x="395" y="305" text-anchor="middle" class="sub">(federated via SAML/OIDC)</text>

  <!-- MCP Router box -->
  <rect x="575" y="150" width="170" height="100" class="box" fill="#ffffff" stroke="#2f9e44"/>
  <text x="660" y="176" text-anchor="middle" class="title">MCP Router</text>
  <text x="660" y="196" text-anchor="middle" class="sub">@sap/xssec validates</text>
  <text x="660" y="211" text-anchor="middle" class="sub">signature · issuer · aud</text>
  <text x="660" y="230" text-anchor="middle" class="sub">extracts email claim</text>

  <!-- Cloud connector -->
  <rect x="580" y="320" width="160" height="68" class="box" fill="#ffffff" stroke="#2f9e44"/>
  <text x="660" y="347" text-anchor="middle" class="title" font-size="14px">Cloud Connector</text>
  <text x="660" y="366" text-anchor="middle" class="sub">email → X.509 (CERTRULE)</text>

  <!-- ABAP -->
  <rect x="790" y="150" width="160" height="100" class="box" fill="#ffffff" stroke="#e8590c"/>
  <text x="870" y="176" text-anchor="middle" class="title">ABAP Backend</text>
  <text x="870" y="196" text-anchor="middle" class="sub">STRUST / CERTRULE</text>
  <text x="870" y="211" text-anchor="middle" class="sub">maps X.509 → SU01 user</text>
  <text x="870" y="230" text-anchor="middle" class="sub">executes as that user</text>

  <!-- Step 1: Client -> IAS -->
  <line x1="215" y1="145" x2="270" y2="145" stroke="#1864ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="240" cy="145" r="9" fill="#1864ab"/>
  <text x="240" y="149" text-anchor="middle" class="step">1</text>
  <text x="222" y="132" class="edge-label-sm">auth request</text>

  <!-- Step 2: IAS -> Entra (federation) -->
  <line x1="395" y1="192" x2="395" y2="240" stroke="#1864ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="395" cy="216" r="9" fill="#1864ab"/>
  <text x="395" y="220" text-anchor="middle" class="step">2</text>
  <text x="410" y="220" class="edge-label-sm">federation</text>

  <!-- Step 3: IAS -> Client (token) -->
  <path d="M270,178 C246,200 246,215 218,215" fill="none" stroke="#1864ab" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="235" cy="211" r="9" fill="#1864ab"/>
  <text x="235" y="215" text-anchor="middle" class="step">3</text>
  <text x="65" y="235" class="edge-label-sm">access token (aud = router client id, email claim)</text>

  <!-- Step 4: Client -> Router (Bearer) -->
  <path d="M130,192 L130,530 L570,530" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="340" cy="530" r="9" fill="#2f9e44"/>
  <text x="340" y="534" text-anchor="middle" class="step">4</text>
  <text x="163" y="520" class="edge-label-sm">POST /mcp — Authorization: ******;token&gt;</text>

  <!-- Step 5: Router validates token, then forwards to Cloud Connector -->
  <line x1="660" y1="250" x2="660" y2="314" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="660" cy="282" r="9" fill="#2f9e44"/>
  <text x="660" y="286" text-anchor="middle" class="step">5</text>
  <text x="641" y="270" text-anchor="end" class="edge-label-sm">token valid —</text>
  <text x="641" y="296" text-anchor="end" class="edge-label-sm">principal propagation</text>

  <!-- Step 6: Cloud connector -> ABAP -->
  <path d="M740,335 C775,300 780,255 795,220" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <circle cx="768" cy="278" r="9" fill="#e8590c"/>
  <text x="768" y="282" text-anchor="middle" class="step">6</text>
  <text x="784" y="278" class="edge-label-sm">X.509</text>
  <text x="784" y="292" class="edge-label-sm">client cert</text>

  <!-- Step 7: ABAP -> back through the chain -->
  <path d="M860,250 C700,300 700,470 200,580 C150,600 130,560 130,196" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <circle cx="500" cy="470" r="9" fill="#868e96"/>
  <text x="500" y="474" text-anchor="middle" class="step">7</text>
  <text x="516" y="474" class="edge-label-sm">response streamed back to client (SSE / JSON)</text>

  <!-- Legend / failure notes -->
  <rect x="45" y="640" width="490" height="180" rx="10" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="60" y="662" class="title" font-size="13.5px" fill="#c92a2a">Common failure points</text>
  <text x="60" y="684" class="sub">401 invalid_token — signature / issuer / audience mismatch</text>
  <text x="60" y="702" class="sub">(aud must equal the MCP Router's clientid)</text>
  <text x="60" y="724" class="sub">401 missing_bearer_token — no Authorization header sent</text>
  <text x="60" y="746" class="sub">502 destination_error — token OK, Cloud Connector destination not resolving</text>
  <text x="60" y="768" class="sub">ABAP rejects X.509 — asserted e-mail ≠ SU01 user's e-mail (STRUST/CERTRULE)</text>
  <text x="60" y="790" class="sub">200 / SSE stream — full chain working end to end</text>

  <rect x="555" y="640" width="425" height="110" rx="10" fill="#ffffff" stroke="#dee2e6"/>
  <text x="570" y="662" class="title" font-size="13.5px" fill="#1b1f23">Legend</text>
  <circle cx="573" cy="682" r="6" fill="#1864ab"/>
  <text x="588" y="687" class="sub">OIDC authentication (steps 1–3)</text>
  <circle cx="573" cy="704" r="6" fill="#2f9e44"/>
  <text x="588" y="709" class="sub">Token validation &amp; principal propagation (steps 4–5)</text>
  <circle cx="573" cy="726" r="6" fill="#e8590c"/>
  <text x="588" y="731" class="sub">On-premise execution as SU01 user (step 6)</text>
</svg>
